name: Build SIPPINONTHEBEAT VST3 (Windows x64)

on:
  workflow_dispatch:
  push:name: Build SIPPINONTHEBEAT VST3 (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source into a clean folder
        uses: actions/checkout@v4
        with:
          path: source

      - name: Configure with CMake
        run: cmake -S source -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target SIPPINONTHEBEAT_VST3

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter "SIPPINONTHEBEAT.vst3" | Select-Object -First 1
          if (-not $plugin) {
            $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter "*.vst3" | Select-Object -First 1
          }
          if (-not $plugin) {
            throw "No se encontro el archivo .vst3 despues de compilar."
          }
          Compress-Archive -Path $plugin.FullName -DestinationPath SIPPINONTHEBEAT-Windows-x64.zip -Force

      - name: Upload compiled VST3
        uses: actions/upload-artifact@v4
        with:
          name: SIPPINONTHEBEAT-Windows-x64
          path: SIPPINONTHEBEAT-Windows-x64.zip
          if-no-files-found: error

    branches: [ main ]

jobs:
