      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter "SIPPINONTHEBEAT.vst3" | Select-Object -First 1
          if (-not $plugin) {
            $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
